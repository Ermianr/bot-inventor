name: CI

on:
  pull_request:
    # `edited` re-checks the title, which can change after the pull request is opened.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Lint, test and bindings
    if: github.event_name == 'push' || github.event.action != 'edited'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Ubuntu mirror can stall, so the downloaded packages are cached by week: a run only
      # downloads what is not there, and a run that times out still saves what it got, so the next
      # one gets further. apt checks every cached package against the signed index, so a stale or
      # altered file is downloaded again, never installed.
      - name: Week of the package cache
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore the system packages
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-tauri-${{ steps.week.outputs.week }}
          restore-keys: apt-tauri-

      # Retry a failed download and give up on a silent one.
      - name: Install Tauri's system libraries
        timeout-minutes: 10
        run: |
          sudo cp -n ~/apt-archives/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          APT="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          $APT update
          $APT install --no-install-recommends -y \
            build-essential libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev libssl-dev patchelf

      - name: Collect the downloaded packages
        if: always() && steps.apt-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/apt-archives
          sudo cp -n /var/cache/apt/archives/*.deb ~/apt-archives/ || true
          sudo chown -R "$USER" ~/apt-archives

      - name: Save the system packages
        if: always() && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-tauri-${{ steps.week.outputs.week }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest,cargo-deny

      - run: pnpm install --frozen-lockfile
      - run: cargo xtask lint
      - run: cargo xtask test
      - name: Generated bindings match the committed ones
        run: cargo xtask bindings --check

  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The title becomes the commit on main. It reaches the shell through the environment, never
      # through the script text, because it is written by whoever opens the pull request.
      - name: Pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | pnpm exec commitlint

      - name: Commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE" --to "$HEAD"
