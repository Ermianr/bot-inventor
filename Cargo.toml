[workspace]
members = ["crates/*", "apps/desktop/src-tauri", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.99"
repository = "https://github.com/Ermianr/bot-inventor"
publish = false

[workspace.dependencies]
anyhow = "1"
# Pinned to the exact version; the features are chosen in `crates/runtime` (docs/DECISIONS.md).
cel = { version = "=0.15.0", default-features = false }
insta = "1"
proptest = "1"
rmp-serde = "1"
# `bundled` builds SQLite from source; the defaults would add a statement cache and a wasm backend.
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11", default-features = false }
thiserror = "2"
tempfile = "3"
# Features are chosen per crate. The runtime needs only `rt`, `sync` and `time`.
tokio = { version = "1", default-features = false }
zstd = "0.14"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
panic = "warn"
unimplemented = "warn"
dbg_macro = "warn"
todo = "warn"
