[workspace]
members = ["crates/*", "apps/desktop/src-tauri", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.99"
repository = "https://github.com/Ermianr/bot-inventor"
publish = false

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
panic = "warn"
unimplemented = "warn"
dbg_macro = "warn"
todo = "warn"
