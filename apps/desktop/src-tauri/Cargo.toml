[package]
name = "desktop"
description = "The Tauri app: commands, run supervisor and the Svelte frontend."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "desktop_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
graph = { path = "../../../crates/graph", features = ["specta"] }
runtime = { path = "../../../crates/runtime", features = ["specta"] }
serde.workspace = true
specta.workspace = true
specta-typescript = "=0.0.13"
serde_json.workspace = true
thiserror.workspace = true
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
