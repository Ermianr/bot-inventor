[package]
name = "platform-discord"
description = "The Platform implementation on twilight: gateway, HTTP, cache and command registration."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
runtime = { path = "../runtime" }
# twilight's rustls has no crypto provider of its own; `ring` is installed in `tls::install`.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
twilight-cache-inmemory = "0.17"
twilight-gateway = "0.17"
twilight-http = "0.17"
twilight-model = "0.17"

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "test-util"] }
