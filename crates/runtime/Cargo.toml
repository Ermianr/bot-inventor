[package]
name = "runtime"
description = "The node catalog, validation, compile and the run executor."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Serializes the node schemas and derives `specta::Type` on them, for the property panel of the editor.
specta = ["graph/specta", "dep:serde", "dep:specta"]

[dependencies]
cel.workspace = true
graph = { path = "../graph" }
serde = { workspace = true, optional = true }
serde_json.workspace = true
sha2.workspace = true
specta = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[dev-dependencies]
insta.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
