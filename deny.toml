# cargo-deny: advisories, licenses, bans and sources (docs/DEVELOPMENT-GUIDE.md §6).

[advisories]
ignore = [
    # Unmaintained, not a vulnerability. Pulled in by `specta` (a proc macro, build time only).
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained; no replacement in specta yet" },
    # Unmaintained, not a vulnerability. Pulled in by the GTK bindings that Tauri uses on Linux.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error comes from gtk-rs through tauri" },
]

[licenses]
# Only licenses compatible with `MIT OR Apache-2.0`. Add one only when a dependency needs it.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    # The CA certificates of Mozilla (`webpki-root-certs`, through the TLS verifier of twilight).
    "CDLA-Permissive-2.0",
    "MIT",
    "ISC",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
# Tauri's tree has duplicate versions we cannot fix, and listing them on every run is noise.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
